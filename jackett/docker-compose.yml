services: 
  gluetun: 
    image: qmcgaw/gluetun 
    container_name: gluetun 
    hostname: gluetun 
    cap_add: 
      - NET_ADMIN 
    devices: 
      - /dev/net/tun:/dev/net/tun 
    ports: 
      - 6882:6881 
      - 6882:6881/udp 
      - 9117:9117 # Jackett 
      - 8191:8191 # flaresolverr
    volumes: 
      - ./gluetunConfigs:/gluetun 
    environment: 
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_ENDPOINT_IP=4.227.246.106
      - WIREGUARD_ENDPOINT_PORT=51820
      - WIREGUARD_PUBLIC_KEY=NZbSHkl2Xr2G9/Hb83efq6wJHq28s+fkTmznrB1SsC8=
      # Secrets live in jackett/.env (gitignored) - see .env.example
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:?set in jackett/.env}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY:?set in jackett/.env}
      - WIREGUARD_ADDRESSES=10.8.0.2/24 
    restart: unless-stopped 

  jackett: 
    image: lscr.io/linuxserver/jackett:latest 
    container_name: jackett 
    network_mode: "service:gluetun" 
    environment: 
      - PUID=1000 
      - PGID=1000 
      - TZ=Asia/Kolkata 
      - AUTO_UPDATE=true #optional 
      - RUN_OPTS= #optional 
    volumes: 
      - .\config:/config 
      - E:\Media\TorrentDownloads:/downloads 
    restart: unless-stopped 

  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Asia/Kolkata
    restart: unless-stopped 
